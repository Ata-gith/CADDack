[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caddack"
version = "0.1.0"
description = "CADDack: modular CADD toolkit"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Ata Ozkan"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "requests>=2.28",
    "joblib>=1.2",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.0",
    "torch-geometric>=2.3",
    "torch-scatter>=2.1",
    "rdkit>=2023.3",
]
docking = [
    "vina>=1.2.5",
    "meeko>=0.5",
    "gemmi",          # meeko's receptor templates need it, but it is not a hard dep
    "rdkit>=2023.3",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
caddack = "caddack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  # zip(strict=) changes runtime behaviour (raises on length mismatch), so it
  # wants a per-call-site decision rather than a blanket rewrite.
  "B905",
  # Stylistic only; the explicit forms here are clearer than the suggested ones.
  "SIM105", "SIM102", "SIM108", "SIM115",
]
# Examples are teaching material: linear top-to-bottom scripts, not library code.
exclude = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["slow: excluded by default"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rdkit.*", "torch.*", "torch_geometric.*", "torch_scatter.*", "meeko.*", "vina.*", "sklearn.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true
